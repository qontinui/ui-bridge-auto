name: Publish to npm

# Tag-triggered publishing for @qontinui/ui-bridge-auto via npm
# Trusted Publishing (OIDC). No long-lived NPM_TOKEN secret — GitHub
# mints a short-lived OIDC JWT that npm verifies against the per-package
# trust policy configured at npmjs.com. Mirrors the pattern in
# qontinui/ui-bridge's publish.yml.
#
# To release:
#   1. Bump `version` in package.json + commit on master.
#   2. `git push origin master` so the release commit is on the remote.
#   3. `git tag v<version> && git push origin v<version>` — this workflow
#      fires on tag push and runs: the release-invariant assertions below →
#      npm ci → typecheck → lint → build → test → npm publish --provenance.
#      Any red check aborts the release; nothing reaches the registry
#      unverified.
#
# One-time npmjs.com setup (per package, by an @qontinui maintainer):
#   npmjs.com → @qontinui/ui-bridge-auto → Settings → Trusted Publisher →
#   Add: organization=qontinui, repository=ui-bridge-auto,
#        workflow filename=publish.yml, environment=(blank).
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for npm trusted publishing — GitHub mints a short-lived
      # OIDC JWT that npm verifies against the per-package trust policy
      # configured at npmjs.com. No long-lived NPM_TOKEN secret needed.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the master-ancestry assertion below is exact. A
          # shallow graph makes `git merge-base --is-ancestor` answer about the
          # truncation rather than about the branch; this repo is ~100 commits,
          # so depth 0 costs nothing measurable.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # THE RELEASE INVARIANTS, ASSERTED BEFORE ANYTHING EXPENSIVE RUNS.
      #
      # CLAUDE.md's release procedure states both of these in prose, and until
      # now nothing enforced either. They are deterministic and cost seconds, so
      # they run ahead of the global npm install, `npm ci` and the build rather
      # than after them. They sit AFTER `setup-node` rather than straight after
      # checkout so the version read below runs on the node pinned above, not on
      # whatever the runner image happens to preinstall.
      #
      # Both hold for every tag this repo has ever published (v0.1.3 .. v0.1.8,
      # checked at authoring time), so neither changes what a correct release
      # does - they only refuse an incorrect one.
      - name: Verify the tag names the version being published
        # `npm publish` reads package.json and ignores the tag completely. So a
        # `v0.1.9` tag on a tree carrying 0.1.10 publishes 0.1.10, and
        # `--provenance` then signs an attestation permanently binding that
        # tarball to a tag that names a different version. Only the colliding
        # case (a tag whose version is already on the registry) fails by itself,
        # and it fails at the very last step, after every check has run.
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}."
            echo "npm publish would publish ${pkg_version} under a tag naming ${tag_version}."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package.json version ${pkg_version}."

      - name: Verify the tagged commit is on master
        # Step 2 of the documented procedure ("push origin master so the release
        # commit is on the remote") exists to guarantee exactly this. A tag
        # pushed from an unmerged branch publishes code that is on no branch:
        # reachable only from the tag, accounted for by no `git log master`, and
        # silently absent from the next release's diff.
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "::error::${GITHUB_SHA} is not an ancestor of origin/master."
            echo "Push the release commit to master before tagging (release step 2)."
            exit 1
          fi
          echo "${GITHUB_SHA} is on master."

      - name: Upgrade npm to 11.5.1+ for trusted publishing
        # actions/setup-node@v5 with node@20 ships npm@10.8.2, but npm
        # Trusted Publishers requires 11.5.1+. Without this, the publish
        # step sends an empty auth header and gets 404 even when the
        # OIDC + provenance flow succeeds.
        #
        # Pin to the 11.x line rather than `@latest`. `@latest` is a moving
        # target and it silently broke this workflow: npm 12 shipped with
        # `engines.node = ^22.22.2 || ^24.15.0 || >=26.0.0`, so on the node@20
        # pinned above it aborts with EBADENGINE and the release never
        # publishes. The v0.1.8 tag failed exactly here on 2026-08-30
        # (run 33299834877), while the identical v0.1.7 release had passed in
        # May -- the only thing that changed was what `@latest` resolved to.
        # qontinui/ui-bridge hit the same wall on its 0.21.0 / 0.3.0 / 0.6.0
        # tags and pinned; this repo mirrors that publish.yml and simply never
        # received the fix.
        #
        # `npm@^11` supports node ^20.17.0 and is comfortably above the
        # 11.5.1 trusted-publishing floor, so it satisfies both constraints
        # and cannot drift out from under us again.
        run: npm install --global npm@^11

      - name: Install dependencies
        run: npm ci

      # THE RELEASE PATH GATES ITSELF - it is the only thing that can.
      #
      # Until 2026-08-31 a `v*` tag push also fired `qontinui CI`, because that
      # workflow was armed with the unfiltered `on: [push, pull_request]` (v0.1.8's
      # tag produced run 33299834859 that way). It never *gated* this job - the two
      # runs raced - but it did record a typecheck/lint/test verdict at the released
      # SHA. Scoping that trigger to `master` + the `merge-candidate*` globs (#25,
      # plan 2026-08-31-devops-unfiltered-push-trigger-duplicates-every-pr-ci-run)
      # was correct and is not being undone here: restoring `tags:` there would
      # recreate exactly the same-SHA duplicate that #25 removed, since the release
      # commit is already on `master` and has already run.
      #
      # But it leaves a tag push firing NOTHING except this workflow, whose only
      # step that can fail is `npm run build`. So the checks move HERE, where they
      # are strictly stronger than what was lost: they run BEFORE `npm publish`, so
      # a red typecheck or a failing test aborts the release rather than racing it.
      # An npm publish is not retractable, and `scripts/verify-published.js` only
      # reports after the tarball is already on the registry.
      #
      # Same checks in the same order as `qontinui-ci.yml`'s `build` job, so a
      # release is gated on what a PR is gated on. Spelled as the package.json
      # scripts rather than that job's `--if-present` / `npx` scaffolding: here the
      # scripts are known to exist, and a silently skipped gate on the release path
      # is the failure this step is meant to remove.
      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish
        # --provenance generates an attestation linking the npm tarball
        # back to this exact commit + workflow run, signed by the OIDC
        # token. Surfaces on the package's npm page under "Provenance".
        run: npm publish --access public --provenance
