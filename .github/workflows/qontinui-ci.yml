name: qontinui CI
# DO NOT DELETE THE `push:` TRIGGER, and do not narrow it past the branch list
# below. coord's merge train pushes `merge-candidate/<uuid>` and waits
# `awaiting-ci` for check-runs on that ref. A `pull_request`-only workflow can
# never satisfy it: the train times out at COORD_MERGE_CI_TIMEOUT (1800s),
# requeues forever, and permanently consumes one of COORD_MERGE_SLOTS
# (default 3). coord also judges "can this repo produce candidate CI?" purely on
# the PRESENCE of this `push:` key (`ci_baseline.rs`
# `is_candidate_check_producing_trigger` is branch-filter-blind by design), so
# deleting it trips AlertKind::MergeCandidateNoCiProducer.
#
# The three `merge-candidate*` prefixes are coord's authoritative list
# (`ci_observer.rs` CANDIDATE_BRANCH_PREFIXES_EXACT). Omitting one wedges the
# train. `master` must stay too: coord's head-baseline axis needs a `push`
# trigger that CAN fire on the default branch.
#
# WHY THIS IS SCOPED RATHER THAN THE `on: [push, pull_request]` IT REPLACED.
# An UNFILTERED `push:` also fired on every PR head branch, so every PR ran this
# workflow TWICE against the same head SHA - two runs of identical work
# competing for the same hosted-runner pool, and the PR pinned at
# mergeStateStatus=UNSTABLE until the slower duplicate drained. A `concurrency:`
# block does NOT fix it: `github.ref` differs by event (`refs/heads/<branch>` vs
# `refs/pull/<n>/merge`) so the two runs land in different groups - measured,
# qontinui-docs and qontinui-gym carry `cancel-in-progress: true` and still emit
# both runs at one SHA. Plan:
# 2026-08-31-devops-unfiltered-push-trigger-duplicates-every-pr-ci-run.
#
# `pull_request:` is deliberately left UNFILTERED so stacked PRs based on a
# long-lived integration branch still get CI.
on:
  push:
    branches:
      - master
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        # `npm ci` with NO `|| npm install` fallback. The fallback silently
        # repaired a `package-lock.json` that no longer satisfied `package.json`
        # and then reported green, so lockfile drift could never fail a build.
        #
        # That is load-bearing for the merge train: since the `push:` trigger above
        # was scoped, this is the ONLY workflow in the repo that can fire on a
        # `merge-candidate/**` ref (`publish.yml`'s `push:` is tag-filtered), and
        # coord lands PRs on the check-runs it produces there. A verdict derived
        # from a silently re-resolved dependency tree is not the verdict coord
        # believes it is reading.
        #
        # Verified safe at the time of the change: `npm ci` against this lockfile
        # exits 0 both locally (232 packages) and on the hosted runner (234 - the
        # difference is platform-optional native deps, not lockfile drift).
        run: npm ci
      # No `--if-present`, and no `[ -f tsconfig.json ]` guard. Those are
      # bootstrap-template scaffolding for a repo whose scripts are unknown. Here
      # every one is known to exist (package.json declares typecheck, lint, build
      # and test), so the guards can no longer protect anything - they can only
      # ever SKIP a gate, silently, and report the skip as a pass.
      #
      # That is the same failure the install step above was just hardened against,
      # on the same load-bearing path and for the same reason: this is the ONLY
      # workflow that fires on a `merge-candidate/**` ref, so its check-runs ARE
      # the verdict coord's merge train lands PRs on, and coord cannot tell a
      # check that passed from one that never ran. A renamed or deleted script
      # would turn a gate into a no-op and keep landing PRs green.
      #
      # `npm run typecheck` also replaces `npx --yes tsc`. That resolves the local
      # binary while one is installed, but `--yes` authorizes it to FETCH a
      # floating TypeScript from the registry when one is not - reintroducing, one
      # step later, exactly the unlocked dependency tree the strict `npm ci` above
      # exists to prevent.
      #
      # These four commands are now identical to `publish.yml`'s gate steps, which
      # is what that workflow's comment already claims of them: a release is gated
      # on what a PR is gated on.
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
